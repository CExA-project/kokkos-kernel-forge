name: build-and-test-macos

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - README.md
    - docs/**
  push:
    branches:
    - main
    paths-ignore:
    - README.md
    - docs/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
        - name: AppleClang Release build and tests
          compiler: appleclang
          cxx: clang++
          build_type: Release
          kkf_enable_asan: OFF
          kkf_enable_ubsan: OFF
          ctest_args: ''
        - name: AppleClang ASan build and tests
          compiler: appleclang-asan
          cxx: clang++
          build_type: RelWithDebInfo
          kkf_enable_asan: ON
          kkf_enable_ubsan: OFF
          ctest_args: -L sanitizer_compatible
        - name: AppleClang UBSan build and tests
          compiler: appleclang-ubsan
          cxx: clang++
          build_type: RelWithDebInfo
          kkf_enable_asan: OFF
          kkf_enable_ubsan: ON
          ctest_args: -L sanitizer_compatible

    steps:
    - name: Check out repository
      uses: actions/checkout@v6

    - name: Install macOS dependencies
      run: |
        brew install hdf5
        echo "HDF5_ROOT=$(brew --prefix hdf5)" >> "$GITHUB_ENV"

    - name: Set build parallelism
      run: echo "JOBS=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"

    - name: Build and test
      uses: ./.github/actions/build-and-test
      with:
        cxx: ${{ matrix.cxx }}
        kokkos-root: ${{ github.workspace }}/.deps/kokkos-${{ matrix.compiler }}
        compiler: ${{ matrix.compiler }}
        build-type: ${{ matrix.build_type }}
        kkf-enable-asan: ${{ matrix.kkf_enable_asan }}
        kkf-enable-ubsan: ${{ matrix.kkf_enable_ubsan }}
        ctest-args: ${{ matrix.ctest_args }}
