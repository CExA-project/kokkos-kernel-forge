name: build-and-test-ubuntu

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - README.md
    - docs/**
  push:
    branches:
    - main
    paths-ignore:
    - README.md
    - docs/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
        - name: gcc Release build and tests
          compiler: gcc
          cxx: g++
          build_type: Release
          kkf_enable_asan: OFF
          kkf_enable_ubsan: OFF
          ctest_args: ''
        - name: clang Release build and tests
          compiler: clang
          cxx: clang++
          build_type: Release
          kkf_enable_asan: OFF
          kkf_enable_ubsan: OFF
          ctest_args: ''
        - name: clang ASan build and tests
          compiler: clang-asan
          cxx: clang++
          build_type: RelWithDebInfo
          kkf_enable_asan: ON
          kkf_enable_ubsan: OFF
          ctest_args: -L sanitizer_compatible
        - name: clang UBSan build and tests
          compiler: clang-ubsan
          cxx: clang++
          build_type: RelWithDebInfo
          kkf_enable_asan: OFF
          kkf_enable_ubsan: ON
          ctest_args: -L sanitizer_compatible

    steps:
    - name: Check out repository
      uses: actions/checkout@v6

    - name: Install Ubuntu dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang \
          cmake \
          g++ \
          hdf5-tools \
          libhdf5-dev \
          ninja-build

    - name: Set build parallelism
      run: echo "JOBS=$(nproc)" >> "$GITHUB_ENV"

    - name: Build and test
      uses: ./.github/actions/build-and-test
      with:
        cxx: ${{ matrix.cxx }}
        kokkos-root: ${{ github.workspace }}/.deps/kokkos-${{ matrix.compiler }}
        compiler: ${{ matrix.compiler }}
        build-type: ${{ matrix.build_type }}
        kkf-enable-asan: ${{ matrix.kkf_enable_asan }}
        kkf-enable-ubsan: ${{ matrix.kkf_enable_ubsan }}
        ctest-args: ${{ matrix.ctest_args }}
