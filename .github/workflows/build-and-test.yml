name: build-and-test

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - README.md
    - docs/**
  push:
    branches:
    - main
    paths-ignore:
    - README.md
    - docs/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
        - name: gcc Release build and tests
          compiler: gcc
          cxx: g++
          build_type: Release
          kkf_enable_asan: OFF
          kkf_enable_ubsan: OFF
          ctest_args: ''
          test_installation: true
        - name: clang Release build and tests
          compiler: clang
          cxx: clang++
          build_type: Release
          kkf_enable_asan: OFF
          kkf_enable_ubsan: OFF
          ctest_args: ''
          test_installation: true
        - name: clang ASan build and tests
          compiler: clang-asan
          cxx: clang++
          build_type: RelWithDebInfo
          kkf_enable_asan: ON
          kkf_enable_ubsan: OFF
          ctest_args: -L sanitizer_compatible
        - name: clang UBSan build and tests
          compiler: clang-ubsan
          cxx: clang++
          build_type: RelWithDebInfo
          kkf_enable_asan: OFF
          kkf_enable_ubsan: ON
          ctest_args: -L sanitizer_compatible

    env:
      CXX: ${{ matrix.cxx }}
      Kokkos_ROOT: ${{ github.workspace }}/.deps/kokkos-${{ matrix.compiler }}
      KOKKOS_VERSION: 5.1.1
      kkf_ROOT: ${{ github.workspace }}/kkf_install

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang \
          cmake \
          g++ \
          hdf5-tools \
          libhdf5-dev \
          ninja-build

    - name: Compute Kokkos cache fingerprint
      run: |
        {
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          echo "ImageOS=${ImageOS:-unknown}"
          echo "ImageVersion=${ImageVersion:-unknown}"
          echo "KOKKOS_VERSION=$KOKKOS_VERSION"
          echo "Kokkos_ENABLE_SERIAL=ON"
          echo "matrix.compiler=${{ matrix.compiler }}"
          echo "CMAKE_BUILD_TYPE=${{ matrix.build_type }}"
          echo "CXX=$CXX"
          "$CXX" --version
          cmake --version
          ninja --version
        } > .kokkos-cache-fingerprint
        cat .kokkos-cache-fingerprint

    - name: Cache Kokkos install
      id: cache-kokkos
      uses: actions/cache@v6
      with:
        path: ${{ env.Kokkos_ROOT }}
        key: kokkos-${{ runner.os }}-${{ runner.arch }}-${{ env.KOKKOS_VERSION }}-${{ matrix.compiler }}-${{ hashFiles('.kokkos-cache-fingerprint') }}

    - name: Build and install Kokkos
      if: steps.cache-kokkos.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch "$KOKKOS_VERSION" https://github.com/kokkos/kokkos.git kokkos-src
        cmake -S kokkos-src -B kokkos-build -G Ninja \
          -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DCMAKE_INSTALL_PREFIX="$Kokkos_ROOT" \
          -DKokkos_ENABLE_SERIAL=ON
        cmake --build kokkos-build --parallel "$(nproc)"
        cmake --install kokkos-build

    - name: Configure project
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
          -DKKF_BUILD_TESTS=ON \
          -DKKF_ENABLE_WARNINGS=ON \
          -DKKF_ENABLE_ASAN="${{ matrix.kkf_enable_asan }}" \
          -DKKF_ENABLE_UBSAN="${{ matrix.kkf_enable_ubsan }}"

    - name: Build project
      run: cmake --build build --parallel "$(nproc)"

    - name: Run tests
      run: ctest --test-dir build --output-on-failure --no-tests=error --parallel "$(nproc)" ${{ matrix.ctest_args }}

    - name: Install the project
      if: ${{ matrix.test_installation }}
      run: cmake --install build --prefix "$kkf_ROOT"

    - name: Test the installation
      if: ${{ matrix.test_installation }}
      working-directory: ${{ github.workspace }}/tests/install_test
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        cmake --build build --parallel "$(nproc)"
        KOKKOS_TOOLS_LIBS="$kkf_ROOT/lib/libkkf.so" KOKKOS_TOOLS_ARGS=--kkf-dump-kernel-label=test_kernel ./build/test
        ./build/replay_test --kernel-replayer-dump *_in.h5 --kernel-replayer-out-dump *_out.h5
