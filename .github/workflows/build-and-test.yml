name: build-and-test

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - README.md
    - docs/**
  push:
    branches:
    - main
    paths-ignore:
    - README.md
    - docs/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
        - name: gcc Release build and tests
          compiler: gcc
          cxx: g++
          build_type: Release
          kokkos_cache_flavor: serial-v1-release
          kkf_enable_asan: OFF
          kkf_enable_ubsan: OFF
          ctest_args: -LE capture_only
        - name: clang Release build and tests
          compiler: clang
          cxx: clang++
          build_type: Release
          kokkos_cache_flavor: serial-v1-release
          kkf_enable_asan: OFF
          kkf_enable_ubsan: OFF
          ctest_args: -LE capture_only
        - name: clang ASan build and tests
          compiler: clang-asan
          cxx: clang++
          build_type: RelWithDebInfo
          cxx_flags: -fsanitize=address -fno-omit-frame-pointer
          linker_flags: -fsanitize=address
          kokkos_cache_flavor: serial-v1-asan
          kkf_enable_asan: ON
          kkf_enable_ubsan: OFF
          ctest_args: -L sanitizer_compatible
        - name: clang UBSan build and tests
          compiler: clang-ubsan
          cxx: clang++
          build_type: RelWithDebInfo
          cxx_flags: -fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
          linker_flags: -fsanitize=undefined
          kokkos_cache_flavor: serial-v1-ubsan
          kkf_enable_asan: OFF
          kkf_enable_ubsan: ON
          ctest_args: -L sanitizer_compatible

    env:
      CXX: ${{ matrix.cxx }}
      Kokkos_ROOT: ${{ github.workspace }}/.deps/kokkos-${{ matrix.compiler }}
      KOKKOS_VERSION: 5.1.1

    steps:
    - name: Check out repository
      uses: actions/checkout@v6

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang \
          cmake \
          g++ \
          hdf5-tools \
          libhdf5-dev \
          ninja-build

    - name: Cache Kokkos install
      id: cache-kokkos
      uses: actions/cache@v5
      with:
        path: ${{ env.Kokkos_ROOT }}
        key: kokkos-${{ runner.os }}-${{ env.KOKKOS_VERSION }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ matrix.kokkos_cache_flavor }}

    - name: Build and install Kokkos
      if: steps.cache-kokkos.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch "$KOKKOS_VERSION" https://github.com/kokkos/kokkos.git kokkos-src
        cmake -S kokkos-src -B kokkos-build -G Ninja \
          -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}" \
          -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.linker_flags }}" \
          -DCMAKE_MODULE_LINKER_FLAGS="${{ matrix.linker_flags }}" \
          -DCMAKE_INSTALL_PREFIX="$Kokkos_ROOT" \
          -DKokkos_ENABLE_SERIAL=ON
        cmake --build kokkos-build --parallel "$(nproc)"
        cmake --install kokkos-build

    - name: Configure project
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DKKF_BUILD_TESTS=ON \
          -DKKF_ENABLE_ASAN="${{ matrix.kkf_enable_asan }}" \
          -DKKF_ENABLE_UBSAN="${{ matrix.kkf_enable_ubsan }}"

    - name: Build project
      run: cmake --build build --parallel "$(nproc)"

    - name: Run tests
      run: ctest --test-dir build --output-on-failure --no-tests=error ${{ matrix.ctest_args }}
